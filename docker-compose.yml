services:
  postgres:
    image: postgres:16-alpine
    container_name: star-postgres
    environment:
      POSTGRES_DB: star
      POSTGRES_USER: star
      POSTGRES_PASSWORD: star_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U star -d star"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
