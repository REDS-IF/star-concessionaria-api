services:
  - type: web
    name: star-concessionaria-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Seed__Admin__Email
        sync: false
      - key: Seed__Admin__Senha
        sync: false
      - key: Seed__Admin__Nome
        value: Administrador
